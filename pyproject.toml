[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "old-computer-manager"
version = "0.1.0a0"
description = "Local-first discovery and diagnostics for older computers"
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0,<7",
]

[project.scripts]
old-computer-manager = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
